services:
  - type: web
    name: mezmur-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Optional. A real YouTube account's cookies.txt (Netscape format),
      # base64-encoded — without it, YouTube's bot-check blocks virtually all
      # datacenter IPs (Render's included) with "Sign in to confirm you're
      # not a bot" on every download. Export via a browser extension like
      # "Get cookies.txt LOCALLY" while logged into YouTube, then:
      #   base64 -i cookies.txt | tr -d '\n'
      # and paste the result as this var's value in the Render dashboard.
      # Leave unset and the importer runs exactly as it does today (no
      # cookies, same as before this var existed).
      - key: YTDLP_COOKIES_B64
        sync: false
      # Web Push (daily Bible verse notification). Generate once locally:
      #   node -e "console.log(require('web-push').generateVAPIDKeys())"
      # and keep it stable — rotating it breaks every existing subscription.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DAILY_VERSE_PUSH_HOUR_UTC
        sync: false
      # Optional. Telegram channel import — MTProto (teleproto/GramJS)
      # user-session credentials, so the server can read a public channel's
      # existing message history (the Bot API can't: a bot only sees
      # messages posted after it joins). Get api_id/api_hash (free) from
      # https://my.telegram.org/apps, then run one of the login scripts
      # locally (never on Render) to produce TELEGRAM_SESSION — see
      # server/scripts/telegramLogin.ts and the README's Telegram gotcha for
      # the full walkthrough. Leave unset and Telegram import shows a clear
      # "isn't configured" error instead of failing silently; every other
      # part of the app is unaffected.
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
