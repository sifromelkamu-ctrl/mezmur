services:
  - type: web
    name: mezmur-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Optional. A real YouTube account's cookies.txt (Netscape format),
      # base64-encoded — without it, YouTube's bot-check blocks virtually all
      # datacenter IPs (Render's included) with "Sign in to confirm you're
      # not a bot" on every download. Export via a browser extension like
      # "Get cookies.txt LOCALLY" while logged into YouTube, then:
      #   base64 -i cookies.txt | tr -d '\n'
      # and paste the result as this var's value in the Render dashboard.
      # Leave unset and the importer runs exactly as it does today (no
      # cookies, same as before this var existed).
      - key: YTDLP_COOKIES_B64
        sync: false
      # Optional. Routes yt-dlp's requests through a proxy — must be a
      # residential/ISP proxy, not another datacenter one (a datacenter
      # proxy just swaps one flagged IP for another). Confirmed in
      # production that cookies + player-client alone couldn't fully
      # resolve YouTube's bot-check for lower-traffic channel content from
      # Render's IP, while the exact same video/cookies worked instantly
      # from a residential IP — this is the actual root-cause fix. Format:
      # http://user:pass@host:port or socks5://user:pass@host:port, from
      # whatever residential-proxy provider you use. Leave unset and yt-dlp
      # runs on Render's own IP exactly as before this var existed.
      - key: YTDLP_PROXY_URL
        sync: false
