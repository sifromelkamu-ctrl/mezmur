services:
  - type: web
    name: mezmur-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Optional. A real YouTube account's cookies.txt (Netscape format),
      # base64-encoded — without it, YouTube's bot-check blocks virtually all
      # datacenter IPs (Render's included) with "Sign in to confirm you're
      # not a bot" on every download. Export via a browser extension like
      # "Get cookies.txt LOCALLY" while logged into YouTube, then:
      #   base64 -i cookies.txt | tr -d '\n'
      # and paste the result as this var's value in the Render dashboard.
      # Leave unset and the importer runs exactly as it does today (no
      # cookies, same as before this var existed).
      - key: YTDLP_COOKIES_B64
        sync: false
      # Web Push (daily Bible verse + twice-daily "Picked for You"
      # notifications). Generate once locally:
      #   node -e "console.log(require('web-push').generateVAPIDKeys())"
      # and keep it stable — rotating it breaks every existing subscription.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DAILY_VERSE_PUSH_HOUR_UTC
        sync: false
      # Optional. "Picked for You" push notifications fire twice a day at
      # these fixed UTC hours (default 9 and 16 — well clear of the daily
      # verse push above so no one gets two pushes back to back). See
      # jobs/pickedForYou.ts.
      - key: PICKED_FOR_YOU_MORNING_HOUR_UTC
        sync: false
      - key: PICKED_FOR_YOU_EVENING_HOUR_UTC
        sync: false
      # Optional. Telegram channel import — MTProto (teleproto/GramJS)
      # user-session credentials, so the server can read a public channel's
      # existing message history (the Bot API can't: a bot only sees
      # messages posted after it joins). Get api_id/api_hash (free) from
      # https://my.telegram.org/apps, then run one of the login scripts
      # locally (never on Render) to produce TELEGRAM_SESSION — see
      # server/scripts/telegramLogin.ts and the README's Telegram gotcha for
      # the full walkthrough. Leave unset and Telegram import shows a clear
      # "isn't configured" error instead of failing silently; every other
      # part of the app is unaffected.
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      # Subscriptions (Stripe). See server/.env.example for the full setup
      # walkthrough. Leave unset and playback for expired-trial users stays
      # limited to short previews with no way to subscribe yet — every other
      # part of the app is unaffected.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional. Admin/owner email notifications for Contact Us messages
      # and song submissions (see src/email.ts) — a free Resend account
      # (https://resend.com) gives you this key with zero domain setup: the
      # default sender (onboarding@resend.dev, no EMAIL_FROM override
      # needed) can email any address on the free tier. Leave unset and
      # these notifications are just silently skipped — Contact Us and
      # Upload Your Songs still work exactly the same, the admin just has to
      # check the in-app inbox/queue instead of getting pinged by email.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
